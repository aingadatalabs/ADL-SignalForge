name: ADL-SignalForge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    # Environment variables injected across all steps in this job
    env:
      API_KEY: "dummy-ci-key-for-import-checks"
      DATABASE_PATH: "./signalforge.duckdb" # Prevents absolute path /data/ permission crashes on CI
      LOG_LEVEL: "WARNING"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff  # Added test framework and linter

      - name: Run Linter / Code Quality Check
        run: |
          # Check code formatting and basic style rules (non-blocking or blocking per preference)
          ruff check . --exit-zero

      - name: Verify Application Syntax & Module Imports
        run: |
          # Test that core modules load successfully without circular dependency or config errors
          python -c "import main; print('main.py imported successfully!')"
          python -c "from scripts import worker; print('worker.py imported successfully!')"

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests directory found, skipping pytest execution."
          fi