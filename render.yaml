services:
  # =========================================================================
  # 1. FastAPI Control Plane Web Service
  # =========================================================================
  - type: web
    name: adl-signalforge-api
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        generateValue: true

  # =========================================================================
  # 2. Pipeline Trigger Cron Job (Scheduled Acquisition & Intelligence)
  # =========================================================================
  - type: cron
    name: adl-signalforge-pipeline-cron
    env: python
    region: oregon
    plan: starter
    branch: main
    schedule: "0 2 * * *"
    scheduleCommand: >
      curl -sSf -X POST https://adl-signalforge-api.onrender.com/api/v1/trigger-pipeline
      -H "X-API-Key: $API_KEY"
    envVars:
      - key: API_KEY
        fromService:
          type: web
          name: adl-signalforge-api
          envVarKey: API_KEY

  # =========================================================================
  # 3. Outbox Dispatch Worker Cron Job (Frequent Batch Cycling)
  # =========================================================================
  - type: cron
    name: adl-signalforge-dispatch-cron
    env: python
    region: oregon
    plan: starter
    branch: main
    schedule: "*/5 * * * *"
    scheduleCommand: >
      curl -sSf -X POST https://adl-signalforge-api.onrender.com/api/v1/dispatch/process
      -H "X-API-Key: $API_KEY"
    envVars:
      - key: API_KEY
        fromService:
          type: web
          name: adl-signalforge-api
          envVarKey: API_KEY