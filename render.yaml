services:
  # ==========================================
  # 1. FastAPI Control Plane Web Service
  # ==========================================
  - type: web
    name: adl-signalforge-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        generateValue: true